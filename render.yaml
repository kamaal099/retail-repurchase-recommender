services:
  - type: web
    name: retail-repurchase-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_demo_service.py
    startCommand: uvicorn retail_ml.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: PYTHONPATH
        value: src
      - key: API_KEY
        sync: false
